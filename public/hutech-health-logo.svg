    </text>
    <!-- Faculty / College Title -->
    <text x="0" y="44" fill="#0f294a" font-family="'Inter', sans-serif, system-ui" font-size="20" font-weight="900" letter-spacing="-0.3">
      KHOA HỌC SỨC KHỎE
    </text>
    <!-- Sub-info -->
    <text x="0" y="66" fill="#00875a" font-family="'Inter', sans-serif, system-ui" font-size="12.5" font-weight="700">
      Đại học Y – Khoa học Sức khỏe HUTECH
    </text>
